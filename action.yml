name: 'IDEA Base Task Update'
description: 'Mark an IDEA Base task done when its PR merges'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  api-key:
    description: 'IDEA Base API key'
    required: true
  task-id:
    description: >-
      The IDEA Base task id to mark done. Required, and never parsed from the
      PR title — a title's "#123" is routinely a GitHub issue number, not a
      task id. Pass it explicitly, e.g. from a prior step that looked it up.
    required: true
  action:
    description: 'Action to perform: mark_done or auto (both mark the task done; there is no time-logging action — see src/github-action.js)'
    required: false
    default: 'auto'

runs:
  using: 'composite'
  steps:
    - name: Process PR
      shell: bash
      env:
        IDEA_BASE_API_KEY: ${{ inputs.api-key }}
        TASK_ID: ${{ inputs.task-id }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_MERGED: ${{ github.event.pull_request.merged }}
        ACTION_TYPE: ${{ inputs.action }}
      run: node "${{ github.action_path }}/src/run-github-action.js"
